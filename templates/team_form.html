{% extends "base.html" %}

{% block title %}{% if team %}编辑球队{% else %}添加球队{% endif %} - NBA 球队管理系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <h1 class="h3 mb-4">{% if team %}编辑球队{% else %}添加球队{% endif %}</h1>
        <div class="panel">
            <div class="panel-body p-4">
                <form action="{% if team %}{{ url_for('edit_team', team_id=team.id) }}{% else %}{{ url_for('add_team') }}{% endif %}" method="post">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="city" class="form-label">城市</label>
                        <input type="text" class="form-control" id="city" name="city" required maxlength="50" value="{{ team.city if team else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="name" class="form-label">球队名称</label>
                        <input type="text" class="form-control" id="name" name="name" required maxlength="80" value="{{ team.name if team else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="abbreviation" class="form-label">球队缩写</label>
                        <input type="text" class="form-control text-uppercase" id="abbreviation" name="abbreviation" required minlength="3" maxlength="3" value="{{ team.abbreviation if team else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="founded_year" class="form-label">成立年份</label>
                        <input type="number" class="form-control" id="founded_year" name="founded_year" required min="1900" max="2030" value="{{ team.founded_year if team else '' }}">
                    </div>
                    <div class="mb-4">
                        <label for="arena" class="form-label">主场球馆</label>
                        <input type="text" class="form-control" id="arena" name="arena" required maxlength="100" value="{{ team.arena if team else '' }}">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>保存
                        </button>
                        <a href="{{ url_for('teams') }}" class="btn btn-outline-secondary">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
